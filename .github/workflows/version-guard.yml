name: Version guard

# Version-Regel: RELEASE.md
# config.yaml/version und growatt_cloud.py/VERSION dürfen nur im Release-Workflow steigen.

on:
  push:
    branches: [master, main]
    paths:
      - "growatt_cloud/config.yaml"
      - "growatt_cloud/growatt_cloud.py"
      - "scripts/check-release-version.sh"
      - ".github/workflows/version-guard.yml"
  pull_request:
    paths:
      - "growatt_cloud/config.yaml"
      - "growatt_cloud/growatt_cloud.py"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce release version policy
        run: bash scripts/check-release-version.sh
