name: Version guard

# config.yaml-Version darf nur im Release-Workflow steigen – sonst HA-Update-Race.

on:
  push:
    branches: [master, main]
    paths:
      - "growatt_cloud/config.yaml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Block manual version bumps
        run: |
          set -euo pipefail
          OLD=$(git show HEAD~1:growatt_cloud/config.yaml 2>/dev/null | sed -n 's/^version: "\(.*\)"/\1/p' || true)
          NEW=$(sed -n 's/^version: "\(.*\)"/\1/p' growatt_cloud/config.yaml | head -1)
          MSG=$(git log -1 --format=%s)

          if [[ -z "$OLD" || "$OLD" == "$NEW" ]]; then
            echo "Version unverändert ($NEW)."
            exit 0
          fi

          if [[ "$MSG" =~ ^Release\ .*\ \(image\ published\ first\)\.$ ]]; then
            echo "Release-Commit erlaubt: $OLD → $NEW"
            exit 0
          fi

          HIGHER=$(printf '%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          if [[ "$HIGHER" == "$NEW" && "$NEW" != "$OLD" ]]; then
            echo "::error::Version $OLD → $NEW in config.yaml – nur via Actions → Release add-on."
            echo "Code committen mit alter Version, dann Release-Workflow starten."
            exit 1
          fi

          echo "Version $OLD → $NEW erlaubt (kein Upgrade ohne Release-Commit)."
