name: Release add-on

# Image zuerst, Versionsbump danach – siehe RELEASE.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version (z.B. 0.1.24)"
        required: true
        type: string
      changelog:
        description: "Kurzer Changelog-Bullet (optional)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-addon
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Prepare version in build tree
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: $V (erwartet x.y.z)"
            exit 1
          fi
          CUR=$(sed -n 's/^version: "\(.*\)"/\1/p' growatt_cloud/config.yaml | head -1)
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release $CUR → $V (${{ matrix.arch }})"
          sed -i "s/^version: \".*\"/version: \"$V\"/" growatt_cloud/config.yaml
          sed -i "s/^VERSION = \".*\"/VERSION = \"$V\"/" growatt_cloud/growatt_cloud.py

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./growatt_cloud
          file: ./growatt_cloud/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/5snowflake5/growatt-cloud/${{ matrix.arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/5snowflake5/growatt-cloud/${{ matrix.arch }}:latest

      - name: Prüfen ob Image anonym pullbar ist (HA braucht public GHCR)
        continue-on-error: true
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          URL="https://ghcr.io/v2/5snowflake5/growatt-cloud/${ARCH}/manifests/${TAG}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "$URL")
          if [[ "$CODE" == "200" ]]; then
            echo "OK: ghcr.io/.../${ARCH}:${TAG} ist public pullbar."
          else
            echo "::warning::GHCR growatt-cloud/${ARCH} ist noch private (HTTP ${CODE})."
            echo "Einmalig: Package settings → Change visibility → Public"
            echo "https://github.com/users/5snowflake5/packages/container/growatt-cloud%2F${ARCH}/settings"
          fi

  publish-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in git (HA Store sieht das erst jetzt)
        env:
          V: ${{ inputs.version }}
          NOTE: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          V="${V#v}"
          CUR=$(sed -n 's/^version: "\(.*\)"/\1/p' growatt_cloud/config.yaml | head -1)
          if [[ "$CUR" == "$V" ]]; then
            echo "config.yaml ist bereits $V – nichts zu committen (Image wurde neu gebaut)."
            exit 0
          fi
          sed -i "s/^version: \".*\"/version: \"$V\"/" growatt_cloud/config.yaml
          sed -i "s/^VERSION = \".*\"/VERSION = \"$V\"/" growatt_cloud/growatt_cloud.py
          TODAY=$(date -u +%Y-%m-%d)
          if grep -q "^## \\[$V\\]" growatt_cloud/CHANGELOG.md; then
            echo "CHANGELOG enthält bereits [$V] – kein neuer Eintrag."
          elif [[ -n "${NOTE// }" ]]; then
            {
              echo "## [$V] – $TODAY"
              echo ""
              echo "### Changed"
              echo "- $NOTE"
              echo ""
            } > /tmp/cl_head.md
            # Changelog nach Titelzeile einfügen
            awk -v add="$(cat /tmp/cl_head.md)" '
              NR==1 { print; next }
              !done && /^## / { print add; done=1 }
              { print }
              END { if (!done) print add }
            ' growatt_cloud/CHANGELOG.md > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md growatt_cloud/CHANGELOG.md
          else
            {
              echo "## [$V] – $TODAY"
              echo ""
              echo "### Changed"
              echo "- Release $V (Image lag vor dem Versionsbump auf GHCR)."
              echo ""
            } > /tmp/cl_head.md
            awk -v add="$(cat /tmp/cl_head.md)" '
              NR==1 { print; next }
              !done && /^## / { print add; done=1 }
              { print }
              END { if (!done) print add }
            ' growatt_cloud/CHANGELOG.md > /tmp/CHANGELOG.md
            mv /tmp/CHANGELOG.md growatt_cloud/CHANGELOG.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growatt_cloud/config.yaml growatt_cloud/growatt_cloud.py growatt_cloud/CHANGELOG.md
          git commit -m "Release $V (image published first)."
          git push origin HEAD:master
          echo "HA Store: Update $CUR → $V ist jetzt sichtbar, Image existiert bereits."
