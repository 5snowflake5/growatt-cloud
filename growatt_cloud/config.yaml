name: Growatt Cloud
version: "0.1.21"
slug: growatt_cloud
description: >-
  Noah/Nexa + MIN-Wechselrichter über Growatt Open API (ein Token, v4).
  MQTT an Home Assistant – Ersatz für noah-mqtt + Growatt-Server-Doppel-Login.
url: https://github.com/5snowflake5/growatt-cloud
arch:
  - aarch64
  - amd64
image: "ghcr.io/5snowflake5/growatt-cloud/{arch}"
init: false
startup: services
boot: auto
services:
  - mqtt:need
options:
  api_token: ""
  server_url: "https://openapi.growatt.com"
  poll_storage_seconds: 60
  poll_inverter_seconds: 300
  poll_devices_seconds: 3600
  sensor_mode: useful
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_discovery_prefix: homeassistant
  mqtt_state_prefix: growatt_cloud
  log_level: info
schema:
  api_token: password
  server_url: str
  poll_storage_seconds: int(60,3600)
  poll_inverter_seconds: int(300,7200)
  poll_devices_seconds: int(300,86400)
  sensor_mode: list(useful|full)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  mqtt_state_prefix: str
  log_level: list(info|debug)
