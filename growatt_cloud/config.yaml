# version nur via Release-Workflow setzen (RELEASE.md)
name: Growatt Cloud
version: "0.1.32"
slug: growatt_cloud
description: Daten aus der Growatt Cloud für Noah, Nexa und Wechselrichter (MQTT).
url: https://github.com/fromWaterToWind/growatt-cloud
arch:
  - aarch64
  - amd64
image: "ghcr.io/fromwatertowind/growatt-cloud/{arch}"
init: false
startup: services
boot: auto
hassio_api: true
homeassistant_api: true
services:
  - mqtt:need
options:
  api_token: ""
  server_url: "https://openapi.growatt.com"
  poll_storage_seconds: 60
  poll_inverter_seconds: 300
  poll_devices_seconds: 3600
  sensor_mode: useful
  timezone: ""
  pack_capacity_wh: 2048
  stale_after_hours: 24
  skip_serials: ""
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_discovery_prefix: homeassistant
  mqtt_state_prefix: growatt_cloud
  log_level: info
schema:
  api_token: password
  server_url: str
  poll_storage_seconds: int(1,86400)
  poll_inverter_seconds: int(1,86400)
  poll_devices_seconds: int(1,86400)
  sensor_mode: list(useful|full)
  timezone: str?
  pack_capacity_wh: int(0,200000)
  stale_after_hours: int(1,720)?
  skip_serials: str?
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str
  mqtt_state_prefix: str
  log_level: list(info|debug)
