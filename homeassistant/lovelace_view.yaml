# Growatt Cloud – Auswertung (Sections-View)
#
# Entity-IDs ab Addon 0.1.25 (stabil, aus Sensor-Keys – nicht aus Anzeigenamen):
#   sensor.gc_<serial_klein>_<key>
#
# Noah  example_noah → sensor.gc_example_noah_*
# Nexa  example_nexa → sensor.gc_example_nexa_*
# WR    example_inverter       → sensor.gc_example_inverter_*
#
# Nach Update 0.1.25:
# 1) Alte MQTT-Geräte Noah/Nexa/WR einmal löschen (die mit …_output_power_2 usw.)
# 2) Growatt-Cloud-Addon neu starten
# 3) In Zuständen nach „gc_0pvp“ suchen – dann diese View pasten
#
# Dashboard → ⋮ → Rohkonfiguration → unter `views:` ersetzen.

views:
  - type: sections
    title: Solar Auswertung
    path: solar-auswertung
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Noah – jetzt
            heading_style: title
          - type: gauge
            entity: sensor.gc_example_noah_soc
            name: SoC gesamt
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
          - type: gauge
            entity: sensor.gc_example_noah_battery1_soc
            name: Batterie 1
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.gc_example_noah_battery2_soc
            name: Batterie 2
            min: 0
            max: 100
            needle: true
          - type: entities
            entities:
              - entity: sensor.gc_example_noah_solar_power
                name: Solar gesamt
              - entity: sensor.gc_example_noah_solar_power_tower1
                name: Solar Speicher 1 (PV1+PV2)
              - entity: sensor.gc_example_noah_solar_power_tower2
                name: Solar Speicher 2 (Rest)
              - entity: sensor.gc_example_noah_output_power
                name: Abgabe
              - entity: sensor.gc_example_noah_charging_power
                name: Laden
              - entity: sensor.gc_example_noah_discharge_power
                name: Entladen
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Heute (kWh)
            heading_style: title
          - type: markdown
            content: |
              {% set total = states('sensor.gc_example_noah_generation_today') | float(0) %}
              {% set s1 = states('sensor.gc_example_noah_generation_today_tower1') | float(0) %}
              {% set s2 = states('sensor.gc_example_noah_generation_today_tower2') | float(0) %}
              {% set sum = s1 + s2 %}
              {% set live = states('sensor.gc_example_noah_solar_power') | float(0) %}
              {% set p1 = states('sensor.gc_example_noah_pv1_power') | float(0) %}
              {% set p2 = states('sensor.gc_example_noah_pv2_power') | float(0) %}
              {% set rest = states('sensor.gc_example_noah_solar_power_tower2') | float(0) %}

              **Growatt Generation Today:** {{ total | round(2) }} kWh  
              **Speicher 1 (integriert):** {{ s1 | round(2) }} kWh  
              **Speicher 2 (integriert):** {{ s2 | round(2) }} kWh  
              **Summe S1+S2:** {{ sum | round(2) }} kWh

              ---
              **Live**  
              PV1 {{ p1 | round(0) }} W · PV2 {{ p2 | round(0) }} W · Rest/S2 {{ rest | round(0) }} W  
              Gesamt {{ live | round(0) }} W
          - type: entities
            entities:
              - entity: sensor.gc_example_noah_generation_today
                name: Generation Today (API)
              - entity: sensor.gc_example_noah_generation_today_tower1
                name: Generation Today Speicher 1
              - entity: sensor.gc_example_noah_generation_today_tower2
                name: Generation Today Speicher 2
              - entity: sensor.gc_example_noah_generation_total
                name: Generation Total
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Solar Panele – Kurven (24 h)
            heading_style: title
          - type: history-graph
            title: PV1 · PV2 · Speicher 2 · Gesamt
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_pv1_power
                name: PV1
              - entity: sensor.gc_example_noah_pv2_power
                name: PV2
              - entity: sensor.gc_example_noah_solar_power_tower2
                name: Speicher 2
              - entity: sensor.gc_example_noah_solar_power
                name: Gesamt
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Einzelpanele
            heading_style: title
          - type: history-graph
            title: PV1
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_pv1_power
                name: PV1
          - type: history-graph
            title: PV2
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_pv2_power
                name: PV2
          - type: history-graph
            title: Speicher 2 (Rest)
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_solar_power_tower2
                name: Speicher 2
          - type: history-graph
            title: PV3 / PV4 (API, oft 0)
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_pv3_power
                name: PV3
              - entity: sensor.gc_example_noah_pv4_power
                name: PV4
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Noah Fluss (24 h)
            heading_style: title
          - type: history-graph
            title: Solar · Laden · Entladen · Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_solar_power
                name: Solar
              - entity: sensor.gc_example_noah_charging_power
                name: Laden
              - entity: sensor.gc_example_noah_discharge_power
                name: Entladen
              - entity: sensor.gc_example_noah_output_power
                name: Abgabe
          - type: history-graph
            title: SoC Batterie 1 / 2
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_noah_battery1_soc
                name: Bat 1
              - entity: sensor.gc_example_noah_battery2_soc
                name: Bat 2
              - entity: sensor.gc_example_noah_soc
                name: Gesamt
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Nexa
            heading_style: title
          - type: gauge
            entity: sensor.gc_example_nexa_soc
            name: Nexa SoC
            min: 0
            max: 100
            needle: true
          - type: entities
            entities:
              - entity: sensor.gc_example_nexa_solar_power
                name: Solar
              - entity: sensor.gc_example_nexa_output_power
                name: Abgabe
              - entity: sensor.gc_example_nexa_generation_today
                name: Heute
          - type: history-graph
            title: Nexa Solar / Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_nexa_solar_power
                name: Solar
              - entity: sensor.gc_example_nexa_output_power
                name: Abgabe
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Wechselrichter (MIN)
            heading_style: title
          - type: history-graph
            title: AC Output
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_inverter_ac_power
                name: AC
          - type: history-graph
            title: WR PV Input
            hours_to_show: 24
            entities:
              - entity: sensor.gc_example_inverter_ppv
                name: PV gesamt
              - entity: sensor.gc_example_inverter_ppv1
                name: PPV1
              - entity: sensor.gc_example_inverter_ppv2
                name: PPV2
          - type: markdown
            title: WR heute
            content: |
              {% set ac = states('sensor.gc_example_inverter_energy_today') | float(0) %}
              {% set i1 = states('sensor.gc_example_inverter_energy_today_input_1') | float(0) %}
              {% set i2 = states('sensor.gc_example_inverter_energy_today_input_2') | float(0) %}
              {% set pv = i1 + i2 %}
              {% set loss = pv - ac %}
              {% set pct = (loss / pv * 100) if pv > 0 else 0 %}

              **Input 1:** {{ i1 | round(2) }} kWh  
              **Input 2:** {{ i2 | round(2) }} kWh  
              **PV Summe:** {{ pv | round(2) }} kWh  
              **AC Today:** {{ ac | round(2) }} kWh  
              **Diff:** {{ loss | round(2) }} kWh ({{ pct | round(1) }} %)
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Hausnetz (EcoTracker)
            heading_style: title
          - type: history-graph
            title: Phasenleistung
            hours_to_show: 24
            entities:
              - entity: sensor.ecotracker_power_phase_1
                name: L1
              - entity: sensor.ecotracker_power_phase_2
                name: L2
              - entity: sensor.ecotracker_power_phase_3
                name: L3
          - type: entities
            entities:
              - entity: sensor.ecotracker_power
                name: Power
              - entity: sensor.ecotracker_total_grid_import
                name: Import
              - entity: sensor.ecotracker_total_grid_export
                name: Export
        column_span: 4
