# Growatt / Plant – Auswertung (Sections-View)
#
# Entity-IDs from the add-on plant device (no personal serials):
#   sensor.gc_plant_*
# Per-device PV strings: Settings → Devices → the Noah/Nexa MQTT device.
#
# Dashboard → ⋮ → Raw configuration → under `views:` paste.

views:
  - type: sections
    title: Solar Auswertung
    path: solar-auswertung
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Speicher – jetzt
            heading_style: title
          - type: gauge
            entity: sensor.gc_plant_soc
            name: SoC gesamt
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
          - type: entities
            entities:
              - entity: sensor.gc_plant_solar_power
                name: Solar gesamt
              - entity: sensor.gc_plant_output_power
                name: Abgabe
              - entity: sensor.gc_plant_charging_power
                name: Laden
              - entity: sensor.gc_plant_discharge_power
                name: Entladen
              - entity: sensor.gc_plant_battery_energy
                name: Batterie Wh
              - entity: sensor.gc_plant_grid_import_power
                name: Netzbezug
              - entity: sensor.gc_plant_grid_export_power
                name: Einspeisung
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Heute (kWh)
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.gc_plant_generation_today
                name: Solar
              - entity: sensor.gc_plant_charged_today
                name: Geladen
              - entity: sensor.gc_plant_discharged_today
                name: Entladen
              - entity: sensor.gc_plant_energy_today
                name: WR Abgabe
              - entity: sensor.growatt_eigenverbrauch
                name: Eigenverbrauch
              - entity: sensor.growatt_autarkie
                name: Autarkie
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Fluss (24 h)
            heading_style: title
          - type: history-graph
            title: Solar · Laden · Entladen · Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.gc_plant_solar_power
                name: Solar
              - entity: sensor.gc_plant_charging_power
                name: Laden
              - entity: sensor.gc_plant_discharge_power
                name: Entladen
              - entity: sensor.gc_plant_output_power
                name: Abgabe
          - type: history-graph
            title: SoC
            hours_to_show: 24
            entities:
              - entity: sensor.gc_plant_soc
                name: SoC
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Wechselrichter
            heading_style: title
          - type: history-graph
            title: AC Output
            hours_to_show: 24
            entities:
              - entity: sensor.gc_plant_ac_power
                name: AC
          - type: markdown
            content: |
              Einzelne PV-Strings und WR-Inputs stehen am jeweiligen MQTT-Gerät
              (`sensor.gc_<serial>_pv1_power`, `…_energy_today_input_1`).
              Optional `input_text.growatt_inverter_id` auf den Serial-Suffix setzen.
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Hausnetz (EcoTracker)
            heading_style: title
          - type: history-graph
            title: Phasenleistung
            hours_to_show: 24
            entities:
              - entity: sensor.ecotracker_power_phase_1
                name: L1
              - entity: sensor.ecotracker_power_phase_2
                name: L2
              - entity: sensor.ecotracker_power_phase_3
                name: L3
          - type: entities
            entities:
              - entity: sensor.ecotracker_power
                name: Power
              - entity: sensor.ecotracker_total_grid_import
                name: Import
              - entity: sensor.ecotracker_total_grid_export
                name: Export
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Volle Last + Mehrbedarf (heute)
            heading_style: title
          - type: entities
            entities:
              - entity: input_number.speicher_voll_last_w
                name: Schwelle volle Last
              - entity: sensor.speicher_abgabe_summe
                name: Abgabe Plant
              - entity: sensor.speicher_vollast_mehrbedarf
                name: Mehrbedarf jetzt
              - entity: sensor.vollast_mit_mehrbedarf_min_heute
                name: Summe Minuten
              - entity: sensor.vollast_defizit_0_250_min_heute
                name: 0–250 W
              - entity: sensor.vollast_defizit_250_500_min_heute
                name: 250–500 W
              - entity: sensor.vollast_defizit_500_800_min_heute
                name: 500–800 W
              - entity: sensor.vollast_defizit_ueber_800_min_heute
                name: ≥ 800 W
        column_span: 2
