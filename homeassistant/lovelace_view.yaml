# Growatt Cloud – Auswertung (Sections-View)
#
# Entity-IDs ab Addon 0.1.25 (stabil, aus Sensor-Keys – nicht aus Anzeigenamen):
#   sensor.gc_<serial_klein>_<key>
#
# Noah  0PVP00ED26UT03E9 → sensor.gc_0pvp00ed26ut03e9_*
# Nexa  0HVRD0ZR247T000V → sensor.gc_0hvrd0zr247t000v_*
# WR    BZP4NXX18C       → sensor.gc_bzp4nxx18c_*
#
# Nach Update 0.1.25:
# 1) Alte MQTT-Geräte Noah/Nexa/WR einmal löschen (die mit …_output_power_2 usw.)
# 2) Growatt-Cloud-Addon neu starten
# 3) In Zuständen nach „gc_0pvp“ suchen – dann diese View pasten
#
# Dashboard → ⋮ → Rohkonfiguration → unter `views:` ersetzen.

views:
  - type: sections
    title: Solar Auswertung
    path: solar-auswertung
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Noah – jetzt
            heading_style: title
          - type: gauge
            entity: sensor.gc_0pvp00ed26ut03e9_soc
            name: SoC gesamt
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
          - type: gauge
            entity: sensor.gc_0pvp00ed26ut03e9_battery1_soc
            name: Batterie 1
            min: 0
            max: 100
            needle: true
          - type: gauge
            entity: sensor.gc_0pvp00ed26ut03e9_battery2_soc
            name: Batterie 2
            min: 0
            max: 100
            needle: true
          - type: entities
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power
                name: Solar gesamt
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power_storage1
                name: Solar PV1–4 (Master)
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power_other_storage
                name: Solar Other Storage
              - entity: sensor.gc_0pvp00ed26ut03e9_output_power
                name: Abgabe
              - entity: sensor.gc_0pvp00ed26ut03e9_charging_power
                name: Laden
              - entity: sensor.gc_0pvp00ed26ut03e9_discharge_power
                name: Entladen
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Heute (kWh)
            heading_style: title
          - type: markdown
            content: |
              {% set total = states('sensor.gc_0pvp00ed26ut03e9_generation_today') | float(0) %}
              {% set pv14 = states('sensor.gc_0pvp00ed26ut03e9_generation_today_storage1') | float(0) %}
              {% set other = states('sensor.gc_0pvp00ed26ut03e9_generation_today_other_storage') | float(0) %}
              {% set sum = pv14 + other %}
              {% set live = states('sensor.gc_0pvp00ed26ut03e9_solar_power') | float(0) %}
              {% set p1 = states('sensor.gc_0pvp00ed26ut03e9_pv1_power') | float(0) %}
              {% set p2 = states('sensor.gc_0pvp00ed26ut03e9_pv2_power') | float(0) %}
              {% set p3 = states('sensor.gc_0pvp00ed26ut03e9_pv3_power') | float(0) %}
              {% set p4 = states('sensor.gc_0pvp00ed26ut03e9_pv4_power') | float(0) %}
              {% set other_w = states('sensor.gc_0pvp00ed26ut03e9_solar_power_other_storage') | float(0) %}

              **Growatt Generation Today:** {{ total | round(2) }} kWh  
              **PV1–4 (integriert):** {{ pv14 | round(2) }} kWh  
              **Other Storage (integriert):** {{ other | round(2) }} kWh  
              **Summe:** {{ sum | round(2) }} kWh

              ---
              **Live**  
              PV1 {{ p1 | round(0) }} W · PV2 {{ p2 | round(0) }} W · PV3 {{ p3 | round(0) }} W · PV4 {{ p4 | round(0) }} W  
              Other Storage {{ other_w | round(0) }} W · Gesamt {{ live | round(0) }} W
          - type: entities
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_generation_today
                name: Generation Today (API)
              - entity: sensor.gc_0pvp00ed26ut03e9_generation_today_storage1
                name: Generation Today PV1–4
              - entity: sensor.gc_0pvp00ed26ut03e9_generation_today_other_storage
                name: Generation Today Other Storage
              - entity: sensor.gc_0pvp00ed26ut03e9_generation_total
                name: Generation Total
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Solar Panele – Kurven (24 h)
            heading_style: title
          - type: history-graph
            title: PV1–4 · Other Storage · Gesamt
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_pv1_power
                name: PV1
              - entity: sensor.gc_0pvp00ed26ut03e9_pv2_power
                name: PV2
              - entity: sensor.gc_0pvp00ed26ut03e9_pv3_power
                name: PV3
              - entity: sensor.gc_0pvp00ed26ut03e9_pv4_power
                name: PV4
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power_other_storage
                name: Other Storage
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power
                name: Gesamt
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Einzelpanele
            heading_style: title
          - type: history-graph
            title: PV1
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_pv1_power
                name: PV1
          - type: history-graph
            title: PV2
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_pv2_power
                name: PV2
          - type: history-graph
            title: Other Storage
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power_other_storage
                name: Other Storage
          - type: history-graph
            title: PV3
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_pv3_power
                name: PV3
          - type: history-graph
            title: PV4
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_pv4_power
                name: PV4
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Noah Fluss (24 h)
            heading_style: title
          - type: history-graph
            title: Solar · Laden · Entladen · Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_solar_power
                name: Solar
              - entity: sensor.gc_0pvp00ed26ut03e9_charging_power
                name: Laden
              - entity: sensor.gc_0pvp00ed26ut03e9_discharge_power
                name: Entladen
              - entity: sensor.gc_0pvp00ed26ut03e9_output_power
                name: Abgabe
          - type: history-graph
            title: SoC Batterie 1 / 2
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0pvp00ed26ut03e9_battery1_soc
                name: Bat 1
              - entity: sensor.gc_0pvp00ed26ut03e9_battery2_soc
                name: Bat 2
              - entity: sensor.gc_0pvp00ed26ut03e9_soc
                name: Gesamt
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Nexa
            heading_style: title
          - type: gauge
            entity: sensor.gc_0hvrd0zr247t000v_soc
            name: Nexa SoC
            min: 0
            max: 100
            needle: true
          - type: entities
            entities:
              - entity: sensor.gc_0hvrd0zr247t000v_solar_power
                name: Solar
              - entity: sensor.gc_0hvrd0zr247t000v_output_power
                name: Abgabe
              - entity: sensor.gc_0hvrd0zr247t000v_generation_today
                name: Heute
          - type: history-graph
            title: Nexa Solar / Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.gc_0hvrd0zr247t000v_solar_power
                name: Solar
              - entity: sensor.gc_0hvrd0zr247t000v_output_power
                name: Abgabe
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Wechselrichter (MIN)
            heading_style: title
          - type: history-graph
            title: AC Output
            hours_to_show: 24
            entities:
              - entity: sensor.gc_bzp4nxx18c_ac_power
                name: AC
          - type: history-graph
            title: WR PV Input
            hours_to_show: 24
            entities:
              - entity: sensor.gc_bzp4nxx18c_ppv
                name: PV gesamt
              - entity: sensor.gc_bzp4nxx18c_ppv1
                name: PPV1
              - entity: sensor.gc_bzp4nxx18c_ppv2
                name: PPV2
          - type: markdown
            title: WR heute
            content: |
              {% set ac = states('sensor.gc_bzp4nxx18c_energy_today') | float(0) %}
              {% set i1 = states('sensor.gc_bzp4nxx18c_energy_today_input_1') | float(0) %}
              {% set i2 = states('sensor.gc_bzp4nxx18c_energy_today_input_2') | float(0) %}
              {% set pv = i1 + i2 %}
              {% set loss = pv - ac %}
              {% set pct = (loss / pv * 100) if pv > 0 else 0 %}

              **Input 1:** {{ i1 | round(2) }} kWh  
              **Input 2:** {{ i2 | round(2) }} kWh  
              **PV Summe:** {{ pv | round(2) }} kWh  
              **AC Today:** {{ ac | round(2) }} kWh  
              **Diff:** {{ loss | round(2) }} kWh ({{ pct | round(1) }} %)
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Hausnetz (EcoTracker)
            heading_style: title
          - type: history-graph
            title: Phasenleistung
            hours_to_show: 24
            entities:
              - entity: sensor.ecotracker_power_phase_1
                name: L1
              - entity: sensor.ecotracker_power_phase_2
                name: L2
              - entity: sensor.ecotracker_power_phase_3
                name: L3
          - type: entities
            entities:
              - entity: sensor.ecotracker_power
                name: Power
              - entity: sensor.ecotracker_total_grid_import
                name: Import
              - entity: sensor.ecotracker_total_grid_export
                name: Export
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Volle Last + Mehrbedarf (heute)
            heading_style: title
          - type: entities
            entities:
              - entity: input_number.speicher_voll_last_w
                name: Schwelle volle Last
              - entity: sensor.speicher_abgabe_summe
                name: Abgabe Noah+Nexa
              - entity: sensor.speicher_vollast_mehrbedarf
                name: Mehrbedarf jetzt
              - entity: sensor.vollast_mit_mehrbedarf_min_heute
                name: Summe Minuten
              - entity: sensor.vollast_defizit_0_250_min_heute
                name: 0–250 W
              - entity: sensor.vollast_defizit_250_500_min_heute
                name: 250–500 W
              - entity: sensor.vollast_defizit_500_800_min_heute
                name: 500–800 W
              - entity: sensor.vollast_defizit_ueber_800_min_heute
                name: ≥ 800 W
        column_span: 2
