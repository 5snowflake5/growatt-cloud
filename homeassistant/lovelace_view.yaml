# Growatt – Auswertung (Nexa via growatt_energy.yaml helpers)
#
# Set input_text.growatt_storage_id to the Nexa entity suffix.
# Per-device PV strings: Settings → Devices → Nexa MQTT device.
#
# Dashboard → ⋮ → Raw configuration → under `views:` paste.

views:
  - type: sections
    title: Solar Auswertung
    path: solar-auswertung
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Speicher – jetzt
            heading_style: title
          - type: gauge
            entity: sensor.growatt_soc
            name: SoC gesamt
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
          - type: entities
            entities:
              - entity: sensor.growatt_solar_power
                name: Solar gesamt
              - entity: sensor.growatt_output_power
                name: Abgabe
              - entity: sensor.growatt_charging_power
                name: Laden
              - entity: sensor.growatt_discharge_power
                name: Entladen
              - entity: sensor.growatt_batterie_wh
                name: Batterie Wh
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Heute (kWh)
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.growatt_solar_heute
                name: Solar
              - entity: sensor.growatt_geladen_heute
                name: Geladen
              - entity: sensor.growatt_entladen_heute
                name: Entladen
              - entity: sensor.growatt_wr_abgabe_heute
                name: WR Abgabe
              - entity: sensor.growatt_eigenverbrauch
                name: Eigenverbrauch
              - entity: sensor.growatt_autarkie
                name: Autarkie
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Fluss (24 h)
            heading_style: title
          - type: history-graph
            title: Solar · Laden · Entladen · Abgabe
            hours_to_show: 24
            entities:
              - entity: sensor.growatt_solar_power
                name: Solar
              - entity: sensor.growatt_charging_power
                name: Laden
              - entity: sensor.growatt_discharge_power
                name: Entladen
              - entity: sensor.growatt_output_power
                name: Abgabe
          - type: history-graph
            title: SoC
            hours_to_show: 24
            entities:
              - entity: sensor.growatt_soc
                name: SoC
        column_span: 4

      - type: grid
        cards:
          - type: heading
            heading: Wechselrichter
            heading_style: title
          - type: markdown
            content: |
              WR-Leistung und PV-Strings stehen am jeweiligen MQTT-Gerät
              (Einstellungen → Geräte). Optional `input_text.growatt_inverter_id`
              auf den Kleinbuchstaben-Suffix setzen.
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Hausnetz (EcoTracker)
            heading_style: title
          - type: history-graph
            title: Phasenleistung
            hours_to_show: 24
            entities:
              - entity: sensor.ecotracker_power_phase_1
                name: L1
              - entity: sensor.ecotracker_power_phase_2
                name: L2
              - entity: sensor.ecotracker_power_phase_3
                name: L3
          - type: entities
            entities:
              - entity: sensor.ecotracker_power
                name: Power
              - entity: sensor.ecotracker_total_grid_import
                name: Import
              - entity: sensor.ecotracker_total_grid_export
                name: Export
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Volle Last + Mehrbedarf (heute)
            heading_style: title
          - type: entities
            entities:
              - entity: input_number.speicher_voll_last_w
                name: Schwelle volle Last
              - entity: sensor.speicher_abgabe_summe
                name: Abgabe Plant
              - entity: sensor.speicher_vollast_mehrbedarf
                name: Mehrbedarf jetzt
              - entity: sensor.vollast_mit_mehrbedarf_min_heute
                name: Summe Minuten
              - entity: sensor.vollast_defizit_0_250_min_heute
                name: 0–250 W
              - entity: sensor.vollast_defizit_250_500_min_heute
                name: 250–500 W
              - entity: sensor.vollast_defizit_500_800_min_heute
                name: 500–800 W
              - entity: sensor.vollast_defizit_ueber_800_min_heute
                name: ≥ 800 W
        column_span: 2
