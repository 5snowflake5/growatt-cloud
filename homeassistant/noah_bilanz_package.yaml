# NOAH-Bilanz aus SoC + Solar + WR-Abgabe
#
# Kapazität: 4096 Wh = 100 % SoC
#
# S0  = Batterie-Wh um Mitternacht (heute) – nicht erst beim ersten Solar
# X   = Solarproduktion heute (Wh) = generation_today × 1000
# Y   = NOAH→WR heute (Wh) = (energy_today_input_1 + _2) × 1000
# Balkon = WR→Haus (Wh) = energy_today × 1000
# WR-Verlust = Y − Balkon
# S1  = Batterie-Wh jetzt = SoC% × 4096
# S2  = (S0 + X) − Y
# Z   = S2 − S1   Bilanzlücke Speicher (nicht Haus-Eigenverbrauch)
#
# Haus: Stromverbrauch = Netzbezug + Balkon − Einspeisung
#
# --- Einrichtung ---
# 1) Entity-IDs unten prüfen (NOAH-Serial 0PVP00ED26UT03E9).
# 2) Nach /config/packages/noah_bilanz.yaml kopieren
# 3) configuration.yaml: homeassistant.packages: !include_dir_named packages
# 4) Neustart
# 5) Helfer „Integral“ falls noch nicht vorhanden:
#      Quelle: sensor.gc_0pvp00ed26ut03e9_output_power
#      Name: NOAH WR Abgabe Energie
#      Präfix: k  → ergibt kWh (wir rechnen intern in Wh um)
#    ODER den Riemann-Sensor unten nutzen (platform integration).
# 6) Automation „S0 setzen“ einmal anlegen (siehe Ende der Datei) ODER
#    input_number.noah_s0_wh manuell/morgens setzen.

input_number:
  noah_kapazitaet_wh:
    name: NOAH Kapazität
    min: 1000
    max: 20000
    step: 1
    mode: box
    unit_of_measurement: Wh
    initial: 4096
    icon: mdi:battery-high

  noah_s0_wh:
    name: Batterie um Mitternacht (SoC₀ Wh)
    min: 0
    max: 20000
    step: 1
    mode: box
    unit_of_measurement: Wh
    initial: 0
    icon: mdi:battery-clock

input_boolean:
  noah_s0_gesetzt_heute:
    name: NOAH S0 heute gesetzt
    icon: mdi:check-circle

# WR-Abgabe als Energie (kWh), falls noch kein Integral existiert.
# Wenn du den Helfer schon hast: diesen Block löschen und unten
# sensor.noah_wr_abgabe_energie auf deinen Helfer umbiegen.
sensor:
  - platform: integration
    source: sensor.gc_0pvp00ed26ut03e9_output_power
    name: "NOAH WR Abgabe Energie"
    unique_id: noah_wr_abgabe_energie_riemann
    unit_prefix: k
    round: 3
    method: left

utility_meter:
  noah_wr_abgabe_heute:
    source: sensor.noah_wr_abgabe_energie
    name: "NOAH WR Abgabe heute"
    cycle: daily

template:
  - sensor:
      - name: "NOAH Batterie Wh"
        unique_id: noah_batterie_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery
        state: >-
          {% set soc = states('sensor.gc_0pvp00ed26ut03e9_soc') | float(0) %}
          {% set cap = states('input_number.noah_kapazitaet_wh') | float(4096) %}
          {{ (soc / 100 * cap) | round(0) }}
        availability: "{{ states('sensor.gc_0pvp00ed26ut03e9_soc') | is_number }}"

      - name: "NOAH Solar heute Wh"
        unique_id: noah_solar_heute_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        icon: mdi:solar-power
        state: >-
          {{ (states('sensor.gc_0pvp00ed26ut03e9_generation_today') | float(0) * 1000) | round(0) }}
        availability: "{{ states('sensor.gc_0pvp00ed26ut03e9_generation_today') | is_number }}"

      - name: "NOAH zum WR heute Wh"
        unique_id: noah_zum_wr_heute_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        icon: mdi:transmission-tower-export
        state: >-
          {% set i1 = states('sensor.gc_bzp4nxx18c_energy_today_input_1') | float(0) %}
          {% set i2 = states('sensor.gc_bzp4nxx18c_energy_today_input_2') | float(0) %}
          {{ ((i1 + i2) * 1000) | round(0) }}
        availability: >-
          {{ states('sensor.gc_bzp4nxx18c_energy_today_input_1') | is_number
             and states('sensor.gc_bzp4nxx18c_energy_today_input_2') | is_number }}

      - name: "NOAH WR Abgabe heute Wh"
        unique_id: noah_wr_abgabe_heute_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total
        icon: mdi:home-export-outline
        state: >-
          {{ (states('sensor.gc_bzp4nxx18c_energy_today') | float(0) * 1000) | round(0) }}
        availability: "{{ states('sensor.gc_bzp4nxx18c_energy_today') | is_number }}"

      - name: "NOAH WR Verlust heute Wh"
        unique_id: noah_wr_verlust_heute_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: measurement
        icon: mdi:flash-alert
        state: >-
          {% set y = states('sensor.noah_zum_wr_heute_wh') | float(0) %}
          {% set b = states('sensor.noah_wr_abgabe_heute_wh') | float(0) %}
          {{ (y - b) | round(0) }}

      # S2 = (S0 + X) - Y
      - name: "NOAH S2 theoretisch Wh"
        unique_id: noah_s2_theoretisch_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-sync
        state: >-
          {% set s0 = states('input_number.noah_s0_wh') | float(0) %}
          {% set x = states('sensor.noah_solar_heute_wh') | float(0) %}
          {% set y = states('sensor.noah_zum_wr_heute_wh') | float(0) %}
          {{ (s0 + x - y) | round(0) }}

      # S1
      - name: "NOAH S1 jetzt Wh"
        unique_id: noah_s1_jetzt_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery
        state: "{{ states('sensor.noah_batterie_wh') }}"
        availability: "{{ states('sensor.noah_batterie_wh') | is_number }}"

      # Z = S2 - S1  (Bilanzlücke / Verluste)
      - name: "NOAH Bilanzlücke Z Wh"
        unique_id: noah_bilanzluecke_z_wh
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: measurement
        icon: mdi:flash-alert
        state: >-
          {% set s2 = states('sensor.noah_s2_theoretisch_wh') | float(0) %}
          {% set s1 = states('sensor.noah_s1_jetzt_wh') | float(0) %}
          {{ (s2 - s1) | round(0) }}

      - name: "NOAH Bilanzlücke Z Prozent von Solar"
        unique_id: noah_bilanzluecke_z_pct
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >-
          {% set z = states('sensor.noah_bilanzluecke_z_wh') | float(0) %}
          {% set x = states('sensor.noah_solar_heute_wh') | float(0) %}
          {{ ((z / x * 100) if x > 0 else 0) | round(1) }}

      # Klartext für Sankey – gleiche Rechnung wie in der Zahlenkarte
      # In/Aus Batterie nur aus SoC jetzt + SoC₀ (Netto seit Mitternacht)
      - name: "Noah in die Batterie heute"
        unique_id: noah_in_die_batterie_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-arrow-up
        state: >-
          {% set cap = states('input_number.noah_kapazitaet_wh') | float(4096) %}
          {% set s1 = states('sensor.gc_0pvp00ed26ut03e9_soc') | float(0) / 100 * cap %}
          {% set s0 = states('input_number.noah_s0_wh') | float(s1) %}
          {% set d = (s1 - s0) / 1000 %}
          {{ (d if d > 0 else 0) | round(3) }}

      - name: "Noah aus der Batterie heute"
        unique_id: noah_aus_der_batterie_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-arrow-down
        state: >-
          {% set cap = states('input_number.noah_kapazitaet_wh') | float(4096) %}
          {% set s1 = states('sensor.gc_0pvp00ed26ut03e9_soc') | float(0) / 100 * cap %}
          {% set s0 = states('input_number.noah_s0_wh') | float(s1) %}
          {% set d = (s0 - s1) / 1000 %}
          {{ (d if d > 0 else 0) | round(3) }}

      - name: "Noah Verlust Batterie heute"
        unique_id: noah_verlust_batterie_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:battery-alert
        state: >-
          {% set cap = states('input_number.noah_kapazitaet_wh') | float(4096) %}
          {% set s1 = states('sensor.gc_0pvp00ed26ut03e9_soc') | float(0) / 100 * cap %}
          {% set s0 = states('input_number.noah_s0_wh') | float(s1) %}
          {% set solar = states('sensor.gc_0pvp00ed26ut03e9_generation_today') | float(0) * 1000 %}
          {% set zum_wr = (states('sensor.gc_bzp4nxx18c_energy_today_input_1') | float(0)
                         + states('sensor.gc_bzp4nxx18c_energy_today_input_2') | float(0)) * 1000 %}
          {{ (((s0 + solar - zum_wr) - s1) / 1000) | round(3) }}

      - name: "Noah Solar zum WR heute"
        unique_id: noah_solar_zum_wr_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:solar-power
        state: >-
          {% set solar = states('sensor.gc_0pvp00ed26ut03e9_generation_today') | float(0) %}
          {% set rein = states('sensor.noah_in_die_batterie_heute') | float(0) %}
          {% set verl = states('sensor.noah_verlust_batterie_heute') | float(0) %}
          {{ (solar - rein - verl) | round(3) }}

      - name: "Noah zum Wechselrichter heute"
        unique_id: noah_zum_wr_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:transmission-tower-export
        state: >-
          {{ (states('sensor.gc_bzp4nxx18c_energy_today_input_1') | float(0)
             + states('sensor.gc_bzp4nxx18c_energy_today_input_2') | float(0)) | round(3) }}

      - name: "Noah Verlust Wechselrichter heute"
        unique_id: noah_verlust_wr_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:flash-alert
        state: >-
          {% set y = states('sensor.noah_zum_wechselrichter_heute') | float(0) %}
          {% set b = states('sensor.gc_bzp4nxx18c_energy_today') | float(0) %}
          {{ (y - b) | round(3) }}

      - name: "Noah vom Balkon genutzt heute"
        unique_id: noah_vom_balkon_genutzt_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:home-import-outline
        state: >-
          {% set balkon = states('sensor.gc_bzp4nxx18c_energy_today') | float(0) %}
          {% set ei = states('sensor.ecotracker_einspeisung_heute') | float(0) / 1000 %}
          {% set g = balkon - ei %}
          {{ (g if g > 0 else 0) | round(3) }}

      - name: "Noah Gesamtstrombedarf heute"
        unique_id: noah_gesamtstrombedarf_heute
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        icon: mdi:home-lightning-bolt
        state: >-
          {% set netz = states('sensor.ecotracker_netzbezug_heute') | float(0) / 1000 %}
          {% set ei = states('sensor.ecotracker_einspeisung_heute') | float(0) / 1000 %}
          {% set balkon = states('sensor.gc_bzp4nxx18c_energy_today') | float(0) %}
          {{ (netz + balkon - ei) | round(3) }}

