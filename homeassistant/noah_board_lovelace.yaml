# Energie-Dashboard – Tabelle + Sankey (Nexa via growatt_energy.yaml)
#
# Requires: growatt_energy.yaml package
# HACS: Sankey Chart Card (MindFreeze)
# Dashboard → Raw configuration → paste from views:

views:
  - type: sections
    title: Energie
    path: energie
    max_columns: 3
    footer:
      max_width: 600
      card:
        type: markdown
        content: "Zeitraum der Monatskarten: letzte 30 Tage (Statistik)."
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Heute auf einen Blick
            heading_style: title
          - type: markdown
            content: |
              {% set speicher_jetzt = states('sensor.growatt_batterie_wh') | float(0) %}
              {% set soc = states('sensor.growatt_soc') | float(0) %}
              {% set soc0 = states('input_number.noah_s0_wh') | float(speicher_jetzt) %}
              {% set solar = states('sensor.growatt_solar_heute') | float(0) %}
              {% set geladen = states('sensor.growatt_geladen_heute') | float(0) %}
              {% set entladen = states('sensor.growatt_entladen_heute') | float(0) %}
              {% set zum_wr = states('sensor.growatt_zum_wr_heute') | float(0) %}
              {% set balkon = states('sensor.growatt_wr_abgabe_heute') | float(0) %}
              {% set verlust_wr = states('sensor.growatt_wr_verlust_heute') | float(0) %}
              {% set netz = states('sensor.ecotracker_netzbezug_heute') | float(0) / 1000 %}
              {% set einspeisung = states('sensor.ecotracker_einspeisung_heute') | float(0) / 1000 %}
              {% set bedarf = states('sensor.growatt_gesamtstrombedarf_heute') | float(0) %}
              {% set genutzt = states('sensor.growatt_vom_balkon_genutzt_heute') | float(0) %}
              {% set eigen = states('sensor.growatt_eigenverbrauch') | float(0) %}
              {% set autark = states('sensor.growatt_autarkie') | float(0) %}

              ## Gesamtstrombedarf: **{{ bedarf | round(2) }} kWh**

              | | kWh |
              |---|---:|
              | Solar erzeugt | {{ solar | round(2) }} |
              | **In die Batterie** | {{ geladen | round(2) }} |
              | **Aus der Batterie** | {{ entladen | round(2) }} |
              | Zum Wechselrichter | {{ zum_wr | round(2) }} |
              | Vom Balkon ins Haus | {{ balkon | round(2) }} |
              | Verlust Wechselrichter | {{ verlust_wr | round(2) }} |
              | Netzbezug | {{ netz | round(2) }} |
              | Einspeisung | {{ einspeisung | round(2) }} |

              Batterie: {{ soc | round(0) }} % jetzt · Start {{ soc0 | round(0) }} Wh  
              Eigenverbrauch {{ eigen | round(0) }} % · Autarkie {{ autark | round(0) }} %
          - type: gauge
            entity: sensor.growatt_soc
            name: Batterie jetzt
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
          - type: entities
            entities:
              - entity: input_number.noah_s0_wh
                name: Batterie um Mitternacht (Wh) = SoC₀
              - entity: input_text.growatt_inverter_id
                name: WR-Suffix (optional)
              - entity: sensor.ecotracker_netzbezug_heute
                name: Netzbezug heute
              - entity: sensor.ecotracker_einspeisung_heute
                name: Einspeisung heute
        column_span: 3

      - type: grid
        cards:
          - type: heading
            heading: Sankey
            heading_style: title
          - type: custom:sankey-chart
            title: Energiefluss heute
            unit_prefix: k
            show_names: true
            show_states: true
            show_units: true
            round: 2
            height: 480
            nodes:
              - id: solar
                entity_id: sensor.growatt_solar_heute
                section: 0
                name: Solar
                color: "#F9A825"

              - id: aus_bat
                entity_id: sensor.growatt_entladen_heute
                section: 0
                name: Aus der Batterie
                color: "#8D6E63"

              - id: netz
                entity_id: sensor.ecotracker_netzbezug_heute
                section: 0
                name: Netzbezug
                color: "#42A5F5"
                unit_of_measurement: Wh

              - id: in_bat
                entity_id: sensor.growatt_geladen_heute
                section: 1
                name: In die Batterie
                color: "#66BB6A"

              - id: zum_wr
                entity_id: sensor.growatt_zum_wr_heute
                section: 2
                name: Zum Wechselrichter
                color: "#29B6F6"

              - id: balkon
                entity_id: sensor.growatt_wr_abgabe_heute
                section: 3
                name: Vom Balkon ins Haus
                color: "#FF7043"

              - id: verlust_wr
                type: remaining_parent_state
                section: 3
                name: Verlust Wechselrichter
                color: "#78909C"

              - id: einspeisung
                entity_id: sensor.ecotracker_einspeisung_heute
                section: 4
                name: Einspeisung
                color: "#26A69A"
                unit_of_measurement: Wh

              - id: genutzt
                type: remaining_parent_state
                section: 4
                name: Balkon genutzt
                color: "#FF8A65"

              - id: bedarf
                type: remaining_parent_state
                section: 5
                name: Gesamtstrombedarf
                color: "#EF5350"

            links:
              - source: solar
                target: in_bat
              - source: solar
                target: zum_wr
              - source: aus_bat
                target: zum_wr
              - source: zum_wr
                target: balkon
              - source: zum_wr
                target: verlust_wr
              - source: balkon
                target: einspeisung
              - source: balkon
                target: genutzt
              - source: genutzt
                target: bedarf
              - source: netz
                target: bedarf
        column_span: 3

      - type: grid
        cards:
          - type: heading
            heading: Live
            heading_style: title
          - type: entity
            entity: sensor.growatt_solar_power
            name: Solar
          - type: entity
            entity: sensor.growatt_charging_power
            name: Laden
          - type: entity
            entity: sensor.growatt_discharge_power
            name: Entladen
          - type: entity
            entity: sensor.growatt_output_power
            name: Abgabe
          - type: entity
            entity: sensor.growatt_wr_abgabe_heute
            name: WR Ausgang
          - type: entity
            entity: sensor.ecotracker_power
            name: Hausnetz
        column_span: 3

      - type: grid
        cards:
          - type: heading
            heading: Monat (30 Tage)
            heading_style: title
          - type: statistics-graph
            title: Solar
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.growatt_solar_heute
                name: Solar
          - type: statistics-graph
            title: Vom Balkon (WR)
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.growatt_wr_abgabe_heute
                name: WR→Haus
          - type: statistics-graph
            title: Netz (EcoTracker)
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.ecotracker_total_grid_import
                name: Bezug
              - entity: sensor.ecotracker_total_grid_export
                name: Einspeisung
        column_span: 3
